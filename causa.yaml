# yaml-language-server: $schema=.causa/configuration-schema.yaml

workspace:
  name: causa

project:
  name: workspace-module-terraform
  description: The Causa workspace module providing functionalities for infrastructure projects coded in Terraform.
  language: typescript
  type: package

causa:
  modules:
    '@causa/workspace-core': ^1.0.0
    '@causa/workspace-typescript': ^1.0.0

javascript:
  dependencies:
    check:
      allowlist:
        - GHSA-86w9-cpqp-85rv
        - GHSA-hp3w-g68c-fv3c
        - GHSA-vfj7-8cjw-p6xm
    update:
      packageTargets:
        '@types/node': minor
        typescript: minor

model:
  schema: jsonschema

  codeGenerators:
    - generator: typescriptModelClass
      globs: [./src/configurations/schemas/*.yaml]
      nestedSchemas: []
      output: src/configurations/generated.ts
